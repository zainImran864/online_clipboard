name: Publish CLI to NPM & PyPI

on:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - 'cli/**'
      - 'python/**'
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish to NPM (pasteport-zisphere)'
        type: boolean
        default: true
      publish_pypi:
        description: 'Publish to PyPI (pasteport-zisphere)'
        type: boolean
        default: true

jobs:
  publish-npm:
    name: Publish to NPM Registry
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.publish_npm != false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies & verify CLI
        working-directory: cli
        run: |
          npm ci || npm install
          node bin/pasteport.js --version

      - name: Check Secret & Publish to NPM
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM_AUTH_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error title=Missing NPM_TOKEN::The secret NPM_TOKEN (or NPM_AUTH_TOKEN) is not set in GitHub repository Secrets. Please go to Settings -> Secrets and variables -> Actions to add your NPM access token."
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$PKG_VER" version >/dev/null 2>&1; then
            echo "$PKG_NAME@$PKG_VER is already published on npm. Skipping publish."
          else
            echo "Publishing $PKG_NAME@$PKG_VER to npm..."
            npm publish --access public
          fi

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.publish_pypi != false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build and twine
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel and source distribution
        working-directory: python
        run: python -m build

      - name: Check Secret & Publish to PyPI
        working-directory: python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN || secrets.PYPI_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::error title=Missing PYPI_API_TOKEN::The secret PYPI_API_TOKEN (or PYPI_TOKEN) is not set in GitHub repository Secrets. Please go to Settings -> Secrets and variables -> Actions to add your PyPI API token (scope: Entire account)."
            exit 1
          fi
          twine upload --skip-existing --verbose dist/*
