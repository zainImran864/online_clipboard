name: Publish CLI to NPM & PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish to NPM (pasteport-zisphere)'
        type: boolean
        default: true
      publish_pypi:
        description: 'Publish to PyPI (pasteport-zisphere)'
        type: boolean
        default: true

jobs:
  publish-npm:
    name: Publish to NPM Registry
    runs-on: ubuntu-latest
    if: inputs.publish_npm != false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies & verify CLI
        working-directory: cli
        run: |
          npm ci || npm install
          node bin/pasteport.js --version

      - name: Publish to NPM
        working-directory: cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: inputs.publish_pypi != false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build and twine
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel and source distribution
        working-directory: python
        run: python -m build

      - name: Publish to PyPI
        working-directory: python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
